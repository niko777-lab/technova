{% extends 'base.html' %}
{% block title %}Log in | Technova{% endblock %}
{% block content %}
<section class="narrow">
  <h1>Log in</h1>
  <form method="post" class="form">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ next }}">
    {% include 'store/_form_fields.html' %}
    <button class="btn btn-lg" type="submit">Log in</button>
  </form>
  <p class="muted">No account yet? <a href="{% url 'register' %}">Sign up</a></p>
</section>
{% endblock %}
